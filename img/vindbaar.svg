<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="56" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="40%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="beam" x1="100" y1="100" x2="168" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- Outer radar ring -->
  <circle cx="100" cy="100" r="86" stroke="white" stroke-width="3" opacity="0.35"/>
  <!-- Middle radar ring -->
  <circle cx="100" cy="100" r="57" stroke="white" stroke-width="3" opacity="0.5"/>
  <!-- Inner radar ring -->
  <circle cx="100" cy="100" r="29" stroke="white" stroke-width="3" opacity="0.65"/>
  <!-- Crosshairs -->
  <line x1="100" y1="7" x2="100" y2="43" stroke="white" stroke-width="2" opacity="0.35"/>
  <line x1="100" y1="157" x2="100" y2="193" stroke="white" stroke-width="2" opacity="0.35"/>
  <line x1="7" y1="100" x2="43" y2="100" stroke="white" stroke-width="2" opacity="0.35"/>
  <line x1="157" y1="100" x2="193" y2="100" stroke="white" stroke-width="2" opacity="0.35"/>
  <!-- Sweep trail -->
  <path d="M100 100 L100 14 A86 86 0 0 1 182 61 Z" fill="white" opacity="0.12"/>
  <!-- Radar beam -->
  <line x1="100" y1="100" x2="168" y2="39" stroke="url(#beam)" stroke-width="5" stroke-linecap="round"/>
  <!-- Blips -->
  <circle cx="168" cy="39" r="8" fill="#fbbf24"/>
  <circle cx="168" cy="39" r="14" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
  <circle cx="57" cy="64" r="5" fill="white" opacity="0.8"/>
  <circle cx="136" cy="143" r="4.5" fill="white" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="9" fill="white"/>
  <circle cx="100" cy="100" r="4.5" fill="#7c3aed"/>
</svg>
